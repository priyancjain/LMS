<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ page_title or "Adaptive Learning POC" }}</title>
    <link rel="stylesheet" href="{{ request.url_for('static', path='style.css') }}" />
  </head>
  <body>
    <main class="page">
      <header class="topbar">
        <div>
          <h1 class="title">{{ page_title or "Adaptive Learning POC" }}</h1>
          {% if subtitle %}
            <p class="subtitle">{{ subtitle }}</p>
          {% endif %}
        </div>
        <div class="row">
          {% if user_email %}
            <span class="muted">{{ user_email }}</span>
          {% endif %}
          {% if role %}
            <span class="badge">{{ role|upper }}</span>
          {% endif %}
        </div>
      </header>

      {% block content %}{% endblock %}
    </main>
  </body>
</html>
